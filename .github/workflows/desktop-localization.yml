name: Desktop localization

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop-localization:
    name: Catalog and scanner gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated catalogs
        run: python3 -B packaging/i18n_catalogs.py --check

      - name: Check catalog coverage and untranslated UI
        run: python3 -B -m unittest app.tests.test_i18n_catalogs app.tests.test_i18n_coverage app.tests.test_installer_locale app.tests.test_windows_shell_structure -v

      - name: Print scanner inventory
        run: python3 -B packaging/i18n_scan.py
