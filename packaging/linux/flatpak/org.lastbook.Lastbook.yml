# The Lastbook Flatpak (pilot, x86_64): the app folder from stage_linux.py, the same as the .deb's /opt/lastbook, at /app/lastbook,
# on the GNOME runtime, which brings Python, PyGObject, GTK 3, WebKitGTK 4.1 and GStreamer (dav1d for AV1, H.264 through codecs-extra).
# Built from this checkout by build_flatpak.sh, which first writes the setup manifest this reads from derived/. The wheels are the
# requirements_linux.txt pins for the runtime's Python, each by SHA-256 (app/tests/test_flatpak_manifest.py checks them against it),
# so the build itself needs no network.
app-id: org.lastbook.Lastbook
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lastbook
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri            # WebKit's drawing; Vulkan for the local AI's runner
  - --socket=pulseaudio     # sound for videos
  - --share=network         # setup's downloads and Check for updates only (engine/setup/download.py: allowed hosts, roots.pem)
modules:
  - name: lastbook
    buildsystem: simple
    build-options:          # the wheels' libraries as published, as in the .deb: no stripping, no separate debug extension
      strip: false
      no-debuginfo: true
    build-commands:
      # The same inputs the .deb build prepares: web/ and content/ as they ship, the setup manifest, the wheels and lastbooksrc
      - python3 -I -B packaging/ship_app_files.py ship
      - install -Dm644 setup-manifest-v1.json ship/setup/manifest-v1.json
      - 'pip3 install --no-index --no-deps --only-binary=:all: --no-compile --target vendor wheels/*.whl'
      - sh packaging/linux/gst/build_lastbooksrc.sh libgstlastbooksrc.so
      # The app folder, from the list the .deb uses too
      - python3 -I -B packaging/linux/stage_linux.py --source . --ship ship --vendor vendor --plugin libgstlastbooksrc.so --opt /app/lastbook
      - python3 -I -m compileall -q -j 1 /app/lastbook
      # Launcher, menu entry, icon, store data
      - install -d /app/bin
      - printf '#!/bin/sh\nexec /usr/bin/python3 -I -B /app/lastbook/lastbook.py "$@"\n' > /app/bin/lastbook
      - chmod 755 /app/bin/lastbook
      - sed -e 's|^Exec=.*|Exec=lastbook|' -e 's|^Icon=.*|Icon=org.lastbook.Lastbook|' packaging/linux/lastbook.desktop
        | install -Dm644 /dev/stdin /app/share/applications/org.lastbook.Lastbook.desktop
      - install -Dm644 packaging/linux/flatpak/org.lastbook.Lastbook.png /app/share/icons/hicolor/512x512/apps/org.lastbook.Lastbook.png
      - sed -e "s|@VERSION@|$(cat /app/lastbook/VERSION)|" -e "s|@DATE@|$(date -u -d @${SOURCE_DATE_EPOCH:-$(date +%s)} +%F)|"
        packaging/linux/flatpak/org.lastbook.Lastbook.metainfo.xml
        | install -Dm644 /dev/stdin /app/share/metainfo/org.lastbook.Lastbook.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip: [.git, derived, library-data, website, website-next, mobile]
      - type: file
        path: ../../../derived/app-build/flatpak/setup/manifest-v1.json
        dest-filename: setup-manifest-v1.json
      # requirements_linux.txt pins for the runtime's Python (3.14), x86_64 and aarch64, plus what they depend on
      - type: file
        dest: wheels
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/31/f3/16820fa6041ecbf6c6b54d1b3dcc23e3489f71447870f36a3d2779092434/libzim-3.13.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: bc29b54e91690de33706d765605d3ca9a63e066ce70175f51bf1169ba63bef70
      - type: file
