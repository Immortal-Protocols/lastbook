name: Release Linux

on:
  workflow_call:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string
    secrets:
      LASTBOOK_PACKS_MANIFEST_B64:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Linux ${{ matrix.arch }} (${{ matrix.deb_arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      LASTBOOK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-venv python3-pil dpkg-dev binutils file gcc pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev curl

      - name: Build the local AI runner
        run: |
          sudo apt-get install -y build-essential git cmake ninja-build glslc libvulkan-dev spirv-headers
          bash packaging/llm/build_llm_linux.sh

      - name: Prepare the release manifest
        env:
          MANIFEST_B64: ${{ secrets.LASTBOOK_PACKS_MANIFEST_B64 }}
          MANIFEST_URL: ${{ vars.LASTBOOK_PACKS_MANIFEST_URL }}
        run: |
          mkdir -p derived/release
          if [ -n "${MANIFEST_B64:-}" ]; then
            printf '%s' "$MANIFEST_B64" | base64 -d > derived/release/manifest-v1.json
          else
            URL="${MANIFEST_URL:-https://downloads.lastbook.org/manifest-v1.json}"
            curl -fsSL "$URL" -o derived/release/manifest-v1.json
          fi
          test -s derived/release/manifest-v1.json
          python3 -I -B packaging/check_release_manifest.py derived/release/manifest-v1.json

      - name: Build the .deb
        env:
          LASTBOOK_BUILD_OUT: ${{ github.workspace }}/build/linux-${{ matrix.arch }}
          LASTBOOK_LLM: ${{ github.workspace }}/derived/llm/bin-linux
          LASTBOOK_CLEAN: "1"
        run: bash packaging/linux/build_app_linux.sh

      # RPM, tarball and AppImage are left out of this first build-only release: they are not verified yet.
      - name: Check the bundled manifest
        run: |
          OUT="$PWD/build/linux-${{ matrix.arch }}"
          python3 -I -B packaging/check_release_manifest.py "$OUT/root/opt/lastbook/setup/manifest-v1.json"

      - name: Check Videos, Map and the local AI
        run: python3 -I -B packaging/smoke_library.py --require-ai

      - name: Collect artifacts
        run: |
          OUT="$PWD/build/linux-${{ matrix.arch }}"
          mkdir -p dist
          cp "$OUT"/Lastbook_*_*.deb dist/
          (cd dist && sha256sum * > "SHA256SUMS-linux-${{ matrix.arch }}.txt")
          ls -lh dist

      - name: Install and launch the .deb in a clean Ubuntu
        run: |
          python3 -B app/tests/fixture.py
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          docker run --rm \
            -v "$PWD/dist:/dist" \
            -v "$PWD/derived/app-build/testdata:/fixture:ro" \
            -v "$PWD:/repo:ro" \
            -v "$PWD/packaging/linux/smoke_deb.sh:/smoke_deb.sh:ro" \
            ubuntu:24.04 bash /smoke_deb.sh "/dist/$(basename "$DEB")" /fixture /repo

      - name: Record the version and checksums
        run: |
          {
            echo "### Linux ${{ matrix.arch }}"
            echo
            echo "- Version: \`${LASTBOOK_VERSION}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Install/launch: clean Ubuntu 24.04 container, Videos, Map and local-AI checks passed"
            echo
            echo '```'
            cat "dist/SHA256SUMS-linux-${{ matrix.arch }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
