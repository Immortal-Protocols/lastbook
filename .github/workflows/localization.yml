name: Localization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated catalogues
        run: python3 -I -B packaging/i18n_catalogs.py --check
      - name: Check scanner and catalogue contracts
        run: python3 -B -m unittest app.tests.test_i18n_catalogs app.tests.test_i18n_coverage
      - name: Reject new hard-coded UI copy
        run: python3 -B packaging/i18n_scan.py
      - name: Check localization engine
        run: node --test app/tests/i18n_core_test.cjs
