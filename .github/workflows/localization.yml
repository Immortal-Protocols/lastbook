name: Localization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check generated catalogues
        run: python3 -I -B packaging/i18n_catalogs.py --check
      - name: Check scanner and catalogue contracts
        run: python3 -B -m unittest app.tests.test_i18n_catalogs app.tests.test_i18n_coverage app.tests.test_i18n_default_deny
      - name: Reject new hard-coded UI copy
        run: python3 -B packaging/i18n_scan.py --check
      - name: Check localization engine
        run: node --test app/tests/i18n_core_test.cjs
