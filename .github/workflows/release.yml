name: Release build (test artifacts)

# Build-only for now: tag pushes and manual runs upload the Linux package and its checksums through Actions. Nothing is
# published to the public Releases page; a release step can be added back once the build and installation checks pass.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to the tag, or today's date)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$V" ] || V="$(date -u +%Y.%m.%d)"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux .deb
    needs: version
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  report:
    name: Linux build report
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' ! -name 'BUILD-REPORT.md' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          ls -lh

      - name: Write the build report
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# Lastbook release build ${VERSION}"
            echo
            echo "- Actions run: ${RUN_URL}"
            echo "- Target: Linux .deb (amd64 and arm64)"
            echo
            echo "## Checksums"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/BUILD-REPORT.md
          cat dist/BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: |
            dist/BUILD-REPORT.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
