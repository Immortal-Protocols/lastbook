name: Release macOS

on:
  workflow_call:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string
      build_local_ai:
        description: Build the optional local AI runner
        required: false
        type: boolean
        default: true
    secrets:
      LASTBOOK_PACKS_MANIFEST_B64:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string
      build_local_ai:
        description: Build the optional local AI runner
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    name: macOS arm64 dmg
    needs: version
    runs-on: macos-14
    env:
      LASTBOOK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install uv cmake

      - name: Build the local AI runner
        if: ${{ inputs.build_local_ai }}
        run: bash packaging/llm/build_llm_macos.sh

      - name: Prepare the release manifest
        env:
          MANIFEST_B64: ${{ secrets.LASTBOOK_PACKS_MANIFEST_B64 }}
          MANIFEST_URL: ${{ vars.LASTBOOK_PACKS_MANIFEST_URL }}
        run: |
          mkdir -p derived/release
          if [ -n "${MANIFEST_B64:-}" ]; then
            printf '%s' "$MANIFEST_B64" | base64 -d > derived/release/manifest-v1.json
          elif [ -n "${MANIFEST_URL:-}" ]; then
            curl -fsSL "$MANIFEST_URL" -o derived/release/manifest-v1.json
          fi
          if [ -s derived/release/manifest-v1.json ]; then
            echo "LASTBOOK_ALLOW_EMPTY_MANIFEST=0" >> "$GITHUB_ENV"
          else
            rm -f derived/release/manifest-v1.json
            echo "LASTBOOK_ALLOW_EMPTY_MANIFEST=1" >> "$GITHUB_ENV"
          fi

      - name: Build Lastbook.app
        env:
          LASTBOOK_BUILD_OUT: ${{ github.workspace }}/build/macos
        run: bash packaging/build_app_macos.sh

      - name: Make the dmg
        run: |
          APP="$(find build/macos -type d -name Lastbook.app -path '*/dist/*' 2>/dev/null | sort | tail -1)"
          if [ -z "$APP" ]; then
            APP="$(find derived/app-build/mac -type d -name Lastbook.app -path '*/dist/*' 2>/dev/null | sort | tail -1)"
          fi
          [ -n "$APP" ] || { echo "Lastbook.app was not built" >&2; exit 1; }
          mkdir -p dist
          DMG="dist/Lastbook-${LASTBOOK_VERSION}-mac.dmg"
          rm -f "$DMG"
          hdiutil create -volname Lastbook -srcfolder "$APP" -ov -format UDZO "$DMG"
          (cd dist && shasum -a 256 "$(basename "$DMG")" > SHA256SUMS-macos.txt)
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
